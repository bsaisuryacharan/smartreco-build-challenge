<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SmartReco{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="/">⚡ SmartReco</a>

    <div class="navbar-search">
      <form action="/search" method="get">
        <input type="text" name="q" placeholder="Search courses…" value="{{ request.query_params.get('q', '') }}" />
        <button class="btn btn-primary btn-sm" type="submit">Search</button>
      </form>
    </div>

    <div class="navbar-links">
      <a href="/">Catalog</a>
      {% if current_user %}
        {% if current_user.role == "admin" %}
          <a href="/admin/">Admin</a>
        {% endif %}
        <span class="navbar-user">{{ current_user.email }}</span>
        <form action="/logout" method="post" style="margin:0">
          <button class="btn btn-secondary btn-sm" type="submit">Logout</button>
        </form>
      {% else %}
        <a href="/login">Sign In</a>
        <a href="/register" class="btn btn-primary btn-sm">Sign Up</a>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  {% if current_user %}
    <script src="/static/js/tracker.js"></script>
  {% endif %}
</body>
</html>
